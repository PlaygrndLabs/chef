<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>chef</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%22-45%200%20270%20270%22%3E%3Cpath%20fill%3D%22%23004dfc%22%20d%3D%22M90%200H180V90H90ZM0%2090H90V180H0ZM90%20180H180V270H90Z%22%2F%3E%3C%2Fsvg%3E">
<script>
(function () {
  try {
    var theme = localStorage.getItem("theme");
    var dark = theme === "dark" || (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.classList.add(dark ? "dark" : "light");
    document.documentElement.style.colorScheme = dark ? "dark" : "light";
  } catch (e) {}
})();
</script>
<style>
html { background: oklch(1 0 0); color: oklch(0.145 0 0); }
html.dark { background: oklch(0.145 0 0); color: oklch(0.985 0 0); }
#splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: inherit; animation: splash-in 0.3s ease-out 0.4s both; }
#splash svg { width: 44px; height: 44px; }
@keyframes splash-in { from { opacity: 0; } }
</style>
<script type="module" src="/src/main.tsx"></script>
</head>
<body>
<div id="splash" aria-busy="true" aria-label="Loading chef"><svg viewBox="-45 0 270 270" aria-hidden="true"><path fill="#004dfc" d="M90 0H180V90H90ZM0 90H90V180H0ZM90 180H180V270H90Z"/></svg></div>
<div id="root"></div>
</body>
</html>
