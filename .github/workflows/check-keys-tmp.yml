name: check-keys-tmp
on:
  push:
    branches: [claude/check-saved-keys-tmp]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHEF_PASSWORD: ${{ secrets.CHEF_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chef/cli exec playwright install --with-deps chromium
      - run: node --import tsx cli/check-keys.tmp.ts
