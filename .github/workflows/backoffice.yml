name: backoffice

on:
  workflow_run:
    workflows: [site]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backoffice
  cancel-in-progress: false

jobs:
  backoffice:
    if: github.repository == 'PlaygrndLabs/chef' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.SITE_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SITE_CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy the backoffice next to the site, on the same account
        working-directory: backoffice
        run: npx wrangler deploy
      - name: Give the backoffice its own session key once
        working-directory: backoffice
        run: |
          set -euo pipefail
          if npx wrangler secret list --format json | jq -e 'map(.name) | index("SESSION_SECRET")' > /dev/null; then
            echo "the backoffice already has its session key"
          else
            openssl rand -base64 48 | tr -d '\n' | npx wrangler secret put SESSION_SECRET
          fi
      - name: Check that the backoffice is up and locked
        run: |
          set -euo pipefail
          host=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r .result.subdomain)
          url="https://chef-backoffice.$host.workers.dev"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$url/api/directory" || true)
            [ "$code" = "401" ] && break
            sleep 10
          done
          [ "$code" = "401" ] || { echo "::error::$url/api/directory answered $code instead of 401"; exit 1; }
          location=$(curl -sS -o /dev/null -w "%{redirect_url}" "$url/")
          echo "$url sends visitors to $location"
          [ "$location" = "$url/auth/start" ] || { echo "::error::$url/ did not send a signed-out visitor to sign in"; exit 1; }
          echo "::notice::The backoffice is at $url"
