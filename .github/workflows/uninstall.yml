name: uninstall

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-pflnbh]
    paths: [.github/workflows/uninstall.yml, site/src/uninstall.ts, site/scripts/uninstall-check.ts]

permissions:
  contents: read

concurrency:
  group: uninstall
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'PlaygrndLabs/chef'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install crane, which the installer uses to copy the sandbox image
        run: curl -fsSL "https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz" | sudo tar -xz -C /usr/local/bin crane
      - name: Set chef up for a throwaway organization the way the site does
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          engine="chef-uninstall-check-$(tr -dc 'a-z0-9' < /dev/urandom | head -c 4)"
          echo "ENGINE=$engine" >> "$GITHUB_ENV"
          image=$(curl -fsS -H "$auth" "$api/workers/scripts/chef-site/settings" | jq -r '.result.bindings[] | select(.name == "SANDBOX_IMAGE") | .text')
          echo "copying $image into $engine"
          creds=$(curl -fsS -X POST -H "$auth" -H "content-type: application/json" "$api/containers/registries/registry.cloudflare.com/credentials" -d '{"expiration_minutes":30,"permissions":["pull"]}')
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "::add-mask::$(jq -r '.result.password' <<< "$creds")"
          job=$(jq -nc --arg a "$CLOUDFLARE_ACCOUNT_ID" --arg n "$engine" --arg p "$password" --arg t "$CLOUDFLARE_API_TOKEN" --arg i "$image" --argjson c "$creds" '{accountId: $a, name: $n, password: $p, token: $t, source: {image: $i, username: $c.result.username, password: $c.result.password}}')
          CHEF_REPO="$PWD" CHEF_JOB=$(printf %s "$job" | base64 -w0) node site/installer/install.mjs | tee "$RUNNER_TEMP/install.log" | jq -r 'if .type == "log" then .line elif .type == "step" then "[\(.id)] \(.state)" else "\(.type): \(.url // .message)" end'
          url=$(jq -r 'select(.type == "done") | .url' "$RUNNER_TEMP/install.log")
          test -n "$url"
          echo "chef for the throwaway organization is at $url"
          curl -sS --max-time 600 -X POST "$url/api/projects" -H "authorization: Bearer $password" -H "content-type: application/json" -d '{"name":"todo"}' | tail -c 1500 || true
      - name: Add an app tagged like chef's and a decoy chef did not make
        run: node --import tsx site/scripts/uninstall-check.ts prepare
      - name: Remove chef for that organization the way the site does, and compare the account before and after
        run: node --import tsx site/scripts/uninstall-check.ts run
      - name: Clean up anything left
        if: always() && env.ENGINE != ''
        run: node --import tsx site/scripts/uninstall-check.ts cleanup
