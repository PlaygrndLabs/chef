name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      name:
        description: Worker name. Leave empty for the development chef (chef-dev); any other name deploys a separate copy with its own repos, memory and previews.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.name || 'chef-dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NAME: ${{ inputs.name || 'chef-dev' }}
      MOVED_FROM: ${{ (inputs.name || 'chef-dev') == 'chef-dev' && 'chef@v2' || '' }}
    steps:
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Skipping deploy: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as Actions secrets to deploy from GitHub, or use the Deploy to Cloudflare button."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - if: steps.creds.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.creds.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: Deploy with the same script as the Deploy to Cloudflare button
        if: steps.creds.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          VOICE_BASE_URL: ${{ secrets.VOICE_BASE_URL || (secrets.LLM_BASE_URL && format('{0}/v1', secrets.LLM_BASE_URL)) || '' }}
          VOICE_API_KEY: ${{ secrets.VOICE_API_KEY || secrets.LLM_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHEF_PASSWORD: ${{ secrets.CHEF_PASSWORD }}
        run: |
          jq -n '{ANTHROPIC_API_KEY: env.ANTHROPIC_API_KEY, LLM_BASE_URL: env.LLM_BASE_URL, LLM_API_KEY: env.LLM_API_KEY, VOICE_BASE_URL: env.VOICE_BASE_URL, VOICE_API_KEY: env.VOICE_API_KEY, TYPESAFE_API_KEY: env.TYPESAFE_API_KEY, CF_API_TOKEN: env.CLOUDFLARE_API_TOKEN, CF_ACCOUNT_ID: env.CLOUDFLARE_ACCOUNT_ID, OPENAI_API_KEY: env.OPENAI_API_KEY, CHEF_PASSWORD: env.CHEF_PASSWORD} | with_entries(select(.value != ""))' > "$RUNNER_TEMP/secrets.json"
          set -o pipefail
          pnpm run deploy --name "$NAME" ${MOVED_FROM:+--moved-from "$MOVED_FROM"} --secrets-file "$RUNNER_TEMP/secrets.json" | tee "$RUNNER_TEMP/deploy.log"
          grep -o 'https://[a-z0-9.-]*workers.dev' "$RUNNER_TEMP/deploy.log" | head -1 > "$RUNNER_TEMP/url"
      - name: Smoke test in the browser's place and through the local app
        if: steps.creds.outputs.ready == 'true'
        env:
          CHEF_PASSWORD: ${{ secrets.CHEF_PASSWORD }}
        run: |
          url=$(cat "$RUNNER_TEMP/url")
          echo "chef is at $url"
          curl -fsS --retry 10 --retry-all-errors --retry-delay 6 -o /dev/null -w '%{http_code}\n' "$url/"
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$url/api/projects")" != 200
          if [ -n "$CHEF_PASSWORD" ]; then
            CHEF_URL="$url" CI=1 node --import tsx cli/src/bin.ts app --no-open --port 4300 &
            for i in $(seq 1 20); do curl -fsS -o /dev/null http://localhost:4300/api/app && break; sleep 1; done
            curl -fsS http://localhost:4300/api/app
            curl -fsS --retry 5 --retry-all-errors --retry-delay 5 -o /dev/null -w 'projects through the local app: %{http_code}\n' http://localhost:4300/api/projects
            kill %1
          fi
