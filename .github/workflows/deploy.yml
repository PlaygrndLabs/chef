name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create the memory index once
        working-directory: workers
        run: |
          if ! npx wrangler vectorize get chef-memory >/dev/null 2>&1; then
            npx wrangler vectorize create chef-memory --dimensions=768 --metric=cosine
            npx wrangler vectorize create-metadata-index chef-memory --property-name=project --type=string
            npx wrangler vectorize create-metadata-index chef-memory --property-name=kind --type=string
          fi
      - name: Deploy with secrets
        working-directory: workers
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || secrets.CPA_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.CPA_API_KEY }}
          VOICE_BASE_URL: ${{ secrets.VOICE_BASE_URL || (secrets.CPA_BASE_URL && format('{0}/v1', secrets.CPA_BASE_URL)) || '' }}
          VOICE_API_KEY: ${{ secrets.VOICE_API_KEY || secrets.CPA_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHEF_PASSWORD: ${{ secrets.CHEF_PASSWORD || secrets.KARGAH_PASSWORD }}
        run: |
          jq -n '{ANTHROPIC_API_KEY: env.ANTHROPIC_API_KEY, LLM_BASE_URL: env.LLM_BASE_URL, LLM_API_KEY: env.LLM_API_KEY, VOICE_BASE_URL: env.VOICE_BASE_URL, VOICE_API_KEY: env.VOICE_API_KEY, TYPESAFE_API_KEY: env.TYPESAFE_API_KEY, CF_API_TOKEN: env.CLOUDFLARE_API_TOKEN, CF_ACCOUNT_ID: env.CLOUDFLARE_ACCOUNT_ID, OPENAI_API_KEY: env.OPENAI_API_KEY, CHEF_PASSWORD: env.CHEF_PASSWORD} | with_entries(select(.value != ""))' > "$RUNNER_TEMP/secrets.json"
          set -o pipefail
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json" | tee "$RUNNER_TEMP/deploy.log"
          grep -o 'https://[a-z0-9.-]*workers.dev' "$RUNNER_TEMP/deploy.log" | head -1 > "$RUNNER_TEMP/url"
      - name: Smoke test
        run: |
          url=$(cat "$RUNNER_TEMP/url")
          echo "chef is at $url"
          curl -fsS -o /dev/null -w '%{http_code}\n' "$url/"
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$url/api/projects/demo/sessions")" != 200
