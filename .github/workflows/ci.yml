name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: git config --global user.email ci@kargah.invalid && git config --global user.name ci
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm spec:lint
      - run: pnpm test
      - run: pnpm test:e2e
