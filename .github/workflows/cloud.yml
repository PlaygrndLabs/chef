name: cloud

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project to bootstrap and build in
        required: true
        default: smoke
      prompt:
        description: Prompt to send
        required: true
        default: Add an item to a todo list
      minutes:
        description: How long to follow the sessions
        required: true
        default: "40"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CHEF_PASSWORD: ${{ secrets.CHEF_PASSWORD || secrets.KARGAH_PASSWORD }}
      CHEF_URL: https://chef.playgrndlabs.workers.dev
      PROJECT: ${{ inputs.project }}
      PROMPT: ${{ inputs.prompt }}
      MINUTES: ${{ inputs.minutes }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Send the prompt and follow its sessions while tailing the Worker
        working-directory: workers
        run: |
          npx wrangler tail chef --format json > "$RUNNER_TEMP/tail.jsonl" 2> "$RUNNER_TEMP/tail.err" &
          sleep 15
          bash ../.github/scripts/follow.sh
      - name: Worker logs
        if: always()
        run: |
          jq -r 'select(.outcome != "ok" or (.logs | length) > 0 or (.exceptions | length) > 0) | [.eventTimestamp, .outcome, ((.event.request.url // .event.rpcMethod // "") | tostring), ((.exceptions // []) | map(.name + ": " + .message) | join(" | ")), ((.logs // []) | map(.message | map(tostring) | join(" ")) | join(" | "))] | @tsv' "$RUNNER_TEMP/tail.jsonl" | cut -c1-2000 | tail -300
          tail -20 "$RUNNER_TEMP/tail.err"
