name: cleanup

on:
  workflow_dispatch:
    inputs:
      prefix:
        description: Name of the test copy (chef-test-<name>) or old leftover whose Cloudflare resources to remove (a Worker named exactly this, or starting with "<prefix>-")
        required: true
      confirm:
        description: Type the prefix again to delete; leave empty to only list what would be deleted
        required: false
        default: ""
      tag:
        description: Only remove Workers carrying this tag (for example chef-project for the old per-project Workers) and nothing else
        required: false
        default: ""

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREFIX: ${{ inputs.prefix }}
      TAG: ${{ inputs.tag }}
      DELETE: ${{ inputs.confirm != '' && inputs.confirm == inputs.prefix }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Find and remove resources
        working-directory: workers
        run: |
          set -euo pipefail
          case "$PREFIX" in chef-dev|chef-test-?*) ;; ""|chef|chef-*) echo "refusing prefix '$PREFIX'"; exit 1;; esac
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          get() { curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$1"; }
          del() { curl -sS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$1" | jq -c '{success, errors}'; }
          match() { jq -r --arg p "$PREFIX" '.[] | select(. == $p or startswith($p + "-"))'; }
          act() { if [ "$DELETE" = "true" ]; then echo "deleting $1"; else echo "would delete $1"; fi; [ "$DELETE" = "true" ]; }

          if [ -n "$TAG" ]; then
            tagged=$(get "workers/workers?per_page=100" | jq -r --arg p "$PREFIX" --arg t "$TAG" '.result[] | select((.name | startswith($p + "-")) and ((.tags // []) | index($t))) | "\(.id) \(.name) tags=\((.tags // []) | join(","))"')
            while read -r id name tags; do [ -n "${id:-}" ] || continue; act "worker $name ($tags)" && { del "workers/scripts/$name?force=true"; del "workers/workers/$id"; }; done <<< "$tagged"
            echo "done (tag=$TAG delete=$DELETE)"
            exit 0
          fi
          workers=$(get "workers/scripts" | jq '[.result[].id]' | match)
          entities=$(get "workers/workers?per_page=100" | jq -r --arg p "$PREFIX" '.result[] | select(.name == $p or (.name | startswith($p + "-"))) | "\(.id) \(.name)"')
          workflows=$(get "workflows?per_page=100" | jq -r --arg p "$PREFIX" '.result[] | select(.script_name == $p or (.script_name | startswith($p + "-"))) | .name')
          namespaces=$(get "workers/durable_objects/namespaces?per_page=1000" | jq -c --arg p "$PREFIX" '[.result[] | select(.script == $p or ((.script // "") | startswith($p + "-"))) | .id]')
          containers=$(get "containers/applications" | jq -r --arg p "$PREFIX" --argjson ns "$namespaces" '.result[] | select((.name | startswith($p + "-")) or ((.durable_objects.namespace_id // "") as $id | $ns | index($id))) | "\(.id) \(.name)"')
          indexes=$(get "vectorize/v2/indexes" | jq '[.result[].name]' | match)
          repos=$(npx wrangler artifacts repos list --namespace "$PREFIX" --json 2>/dev/null | jq -r '(if type == "array" then . else (.repos // .result // []) end)[] | .name // empty' || true)

          for name in $workflows; do act "workflow $name" && del "workflows/$name"; done
          for name in $workers; do act "worker $name" && del "workers/scripts/$name?force=true"; done
          while read -r id name; do [ -n "${id:-}" ] || continue; act "worker $name and its previews" && del "workers/workers/$id"; done <<< "$entities"
          while read -r id name; do [ -n "${id:-}" ] || continue; act "container application $name" && del "containers/applications/$id"; done <<< "$containers"
          for name in $indexes; do act "vectorize index $name" && del "vectorize/v2/indexes/$name"; done
          for name in $repos; do act "artifacts repo $PREFIX/$name" && npx wrangler artifacts repos delete "$name" --namespace "$PREFIX" --force; done
          if npx wrangler artifacts namespaces list --json 2>/dev/null | jq -e --arg p "$PREFIX" '(if type == "array" then . else (.namespaces // .result // []) end) | any(.[]; (.namespace // .name) == $p)' > /dev/null; then
            act "artifacts namespace $PREFIX" && del "artifacts/namespaces/$PREFIX"
          fi
          bucket="${PREFIX:0:51}-transcripts"
          if curl -fsS -o /dev/null -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/r2/buckets/$bucket" 2>/dev/null && act "transcript bucket $bucket and its objects"; then
            for round in $(seq 50); do
              keys=$(get "r2/buckets/$bucket/objects?per_page=1000" | jq -r '.result[]?.key | @uri')
              [ -n "$keys" ] || break
              for key in $keys; do curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/r2/buckets/$bucket/objects/$key"; done
            done
            del "r2/buckets/$bucket"
          fi
          echo "done (delete=$DELETE)"
