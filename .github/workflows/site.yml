name: site

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  site:
    if: github.repository == 'PlaygrndLabs/chef' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.SITE_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SITE_CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish the sandbox image that setups copy into each account
        id: image
        run: |
          version=$(git rev-parse --short=12 HEAD)
          npx wrangler containers build workers/sandbox -t "chef-sandbox:$version" -p
          echo "ref=registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/chef-sandbox:$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Deploy the site
        env:
          SANDBOX_IMAGE: ${{ steps.image.outputs.ref }}
          ENGINE_VERSION: ${{ steps.image.outputs.version }}
        run: |
          jq -n '{CF_API_TOKEN: env.CLOUDFLARE_API_TOKEN, CF_ACCOUNT_ID: env.CLOUDFLARE_ACCOUNT_ID}' > "$RUNNER_TEMP/secrets.json"
          (cd site && npx wrangler deploy --var "SANDBOX_IMAGE:$SANDBOX_IMAGE" --var "ENGINE_VERSION:$ENGINE_VERSION" --secrets-file "$RUNNER_TEMP/secrets.json")
          rm "$RUNNER_TEMP/secrets.json"
      - name: Serve the site at chef.playgrndlabs.com
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          zone=$(curl -sS -H "$auth" "$api/zones?name=playgrndlabs.com&account.id=$CLOUDFLARE_ACCOUNT_ID" | jq -r '.result[0].id // empty')
          if [ -z "$zone" ]; then
            echo "playgrndlabs.com is in another account, so chef.playgrndlabs.com reaches the site through the chef-gateway Pages project"
            curl -sS -o /dev/null -H "$auth" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/chef-gateway" -w "%{http_code}" | grep -q 200 \
              || curl -sS -X POST -H "$auth" -H "content-type: application/json" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" -d '{"name":"chef-gateway","production_branch":"main"}' | jq -c '{success, errors}'
            (cd site/gateway && npx wrangler pages deploy --branch main --commit-dirty=true)
            curl -sS -X POST -H "$auth" -H "content-type: application/json" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/chef-gateway/domains" -d '{"name":"chef.playgrndlabs.com"}' | jq -c '{success, errors}'
            target=$(curl -sS -H "$auth" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/chef-gateway" | jq -r .result.subdomain)
            status=$(curl -sS -H "$auth" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/chef-gateway/domains/chef.playgrndlabs.com" | jq -r '.result.status // "unknown"')
            echo "::notice::chef.playgrndlabs.com is $status. In the account that has playgrndlabs.com, add a CNAME record: chef -> $target"
            exit 0
          fi
          body=$(jq -n --arg zone "$zone" '{hostname: "chef.playgrndlabs.com", service: "chef-site", zone_id: $zone, environment: "production"}')
          attached=$(curl -sS -X PUT -H "$auth" -H "content-type: application/json" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" -d "$body")
          if [ "$(echo "$attached" | jq -r .success)" != "true" ]; then
            echo "::notice::Cloudflare did not attach chef.playgrndlabs.com: $(echo "$attached" | jq -c .errors)"
            exit 0
          fi
          echo "chef.playgrndlabs.com serves the site"
      - name: Create the Sign in with Cloudflare app once
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: |
          set -euo pipefail
          if npx wrangler secret list --config site/wrangler.jsonc --format json | jq -e 'map(.name) | index("OAUTH_CLIENT_ID")' > /dev/null; then
            echo "the sign-in app already exists"
            exit 0
          fi
          api="https://api.cloudflare.com/client/v4"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          host=$(curl -fsS -H "$auth" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r .result.subdomain)
          dev="https://chef-site.$host.workers.dev"
          site="https://chef.playgrndlabs.com"
          if ! curl -fsS -o /dev/null "$site/logo.png"; then
            echo "::notice::$site is not reachable yet, so the sign-in app uses $dev as its home page."
            site="$dev"
          fi
          wanted=$(jq -c 'map(ascii_downcase)' site/oauth-scopes.json)
          available=$(curl -sS -H "$auth" "$api/oauth/scopes" | jq -c '[.result[]? | {id, name}]')
          echo "$available" | jq -r '.[] | "available scope: \(.id) (\(.name))"'
          scopes=$(echo "$available" | jq -c --argjson wanted "$wanted" '[.[] | select(((.name | ascii_downcase) as $n | $wanted | index($n)) or ((.id | ascii_downcase) as $i | $wanted | index($i))) | .id]')
          if [ "$scopes" = "[]" ]; then
            echo "::notice::Cloudflare did not list OAuth scopes for this token. Give CLOUDFLARE_API_TOKEN the OAuth Clients Write permission, then run this workflow again."
            exit 0
          fi
          missing=$(echo "$available" | jq -c --argjson wanted "$wanted" '[$wanted[] as $w | select([.[] | (.name | ascii_downcase), (.id | ascii_downcase)] | index($w) | not) | $w]')
          if [ "$missing" != "[]" ]; then
            echo "::notice::These sign-in scopes did not match any Cloudflare OAuth scope: $missing. Fix site/oauth-scopes.json using the available scopes listed above."
            exit 0
          fi
          echo "scopes: $scopes"
          body=$(jq -n --arg site "$site" --arg dev "$dev" --argjson scopes "$scopes" '{client_name: "chef", client_uri: $site, logo_uri: ($dev + "/logo.png"), redirect_uris: (["https://chef.playgrndlabs.com/auth/callback", $dev + "/auth/callback"] | unique), grant_types: ["authorization_code"], response_types: ["code"], token_endpoint_auth_method: "client_secret_basic", scopes: $scopes}')
          created=$(curl -sS -X POST -H "$auth" -H "content-type: application/json" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/oauth_clients" -d "$body")
          if [ "$(echo "$created" | jq -r .success)" != "true" ]; then
            echo "::notice::Cloudflare did not create the sign-in app: $(echo "$created" | jq -c .errors)"
            exit 0
          fi
          echo "$created" | jq -r '.result.client_id // .result.id' | npx wrangler secret put OAUTH_CLIENT_ID --config site/wrangler.jsonc
          echo "$created" | jq -r '.result.client_secret' | npx wrangler secret put OAUTH_CLIENT_SECRET --config site/wrangler.jsonc
          echo "$scopes" | jq -r 'join(" ")' | npx wrangler secret put OAUTH_SCOPES --config site/wrangler.jsonc
          echo "sign-in app created for $site"
