name: ui

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project to open (created when missing); empty opens the first one
        required: false
        default: ""
      repo:
        description: Repository URL to import when the tour creates the project (Other git host); empty starts fresh
        required: false
        default: ""
      prompt:
        description: Requests to type into the chat, one per line, each sent once the last one is answered; empty only looks around
        required: false
        default: ""
      minutes:
        description: How long to follow the work
        required: true
        default: "25"
      delete:
        description: Delete the project at the end through Project settings (only one this run created), so its sandboxes stop at once; turn off to look at it afterwards
        type: boolean
        required: false
        default: true
      app_click:
        description: Part of the name of a button to press on main's app before its full-page shots (for example 21 or older for an age check); empty presses nothing. Taken after the build when a prompt is sent
        required: false
        default: ""
      image:
        description: Image URL or a file in this repository to attach to the first request in the chat, as a user attaches a screenshot or mockup; empty attaches nothing
        required: false
        default: ""
      delete_existing:
        description: Also delete the named project when it was there before this run (only a test project an earlier run created)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CHEF_URL: https://chef-dev.playgrndlabs.workers.dev
      CHEF_PASSWORD: ${{ secrets.CHEF_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chef/cli exec playwright install --with-deps chromium
      - name: Tail the Worker
        working-directory: workers
        run: |
          mkdir -p ../results/tour
          nohup npx wrangler tail chef-dev --format json > "$RUNNER_TEMP/tail.jsonl" 2> "$RUNNER_TEMP/tail.err" &
          sleep 15
      - name: Walk through the deployed app and take screenshots
        run: |
          args=(--minutes "$MINUTES" --out results/tour)
          [ -n "$PROJECT" ] && args+=(--project "$PROJECT")
          [ -n "$REPO" ] && args+=(--repo "$REPO")
          [ -n "$PROMPT" ] && args+=(--prompt "$PROMPT")
          [ -n "$APP_CLICK" ] && args+=(--app-click "$APP_CLICK")
          [ -n "$IMAGE" ] && args+=(--image "$IMAGE")
          [ "$DELETE" = "true" ] && args+=(--delete)
          [ "$DELETE_EXISTING" = "true" ] && [ -n "$PROJECT" ] && args+=(--delete-existing)
          node --import tsx cli/src/bin.ts tour "${args[@]}"
        env:
          PROJECT: ${{ inputs.project }}
          REPO: ${{ inputs.repo }}
          PROMPT: ${{ inputs.prompt }}
          MINUTES: ${{ inputs.minutes }}
          DELETE: ${{ inputs.delete }}
          DELETE_EXISTING: ${{ inputs.delete_existing }}
          IMAGE: ${{ inputs.image }}
          APP_CLICK: ${{ inputs.app_click }}
      - name: Worker logs
        if: always()
        run: |
          jq -r 'select(.outcome != "ok" or (.logs | length) > 0 or (.exceptions | length) > 0) | [.eventTimestamp, .outcome, ((.event.request.url // .event.rpcMethod // "") | tostring), ((.exceptions // []) | map(.name + ": " + .message) | join(" | ")), ((.logs // []) | map(.message | map(tostring) | join(" ")) | join(" | "))] | @tsv' "$RUNNER_TEMP/tail.jsonl" | cut -c1-2000 > results/tour/worker.tsv || true
          tail -20 "$RUNNER_TEMP/tail.err" >> results/tour/worker.tsv || true
          tail -100 results/tour/worker.tsv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tour
          path: results/tour/
