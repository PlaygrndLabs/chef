name: ui

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project to open (created when missing); empty opens the first one
        required: false
        default: ""
      repo:
        description: Repository URL to import when the tour creates the project (Other git host); empty starts fresh
        required: false
        default: ""
      prompt:
        description: Requests to type into the chat, one per line, each sent once the last one is answered; empty only looks around
        required: false
        default: ""
      minutes:
        description: How long to follow the work
        required: true
        default: "25"
      delete:
        description: Delete the project at the end through Project settings (only one this run created)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CHEF_URL: https://chef-dev.playgrndlabs.workers.dev
      CHEF_PASSWORD: ${{ secrets.CHEF_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chef/cli exec playwright install --with-deps chromium
      - name: Record the demo video
        working-directory: cli
        run: node demo/record-import.mjs
        env:
          PROJECT: ${{ inputs.project }}
          REPO: ${{ inputs.repo }}
          PROMPT: ${{ inputs.prompt }}
          MINUTES: ${{ inputs.minutes }}
          OUT: ../results/demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-import
          path: results/demo/
