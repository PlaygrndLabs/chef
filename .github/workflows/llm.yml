name: llm

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Prompt for the planner and reviewer check
        default: Add an item to a todo list

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CPA_BASE_URL: https://llm-gateway.playgrndlabs.workers.dev
      CPA_API_KEY: ${{ secrets.CPA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --import tsx cli/src/bin.ts llm check "$PROMPT"
        env:
          PROMPT: ${{ inputs.prompt }}
