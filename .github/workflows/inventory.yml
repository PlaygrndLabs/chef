name: inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CHEF_PASSWORD: ${{ secrets.CHEF_PASSWORD }}
      CHEF_URL: https://chef-dev.playgrndlabs.workers.dev
    steps:
      - name: Probe notes2
        run: |
          set -uo pipefail
          auth="authorization: Bearer $CHEF_PASSWORD"
          api="$CHEF_URL/api/projects/notes2"
          echo "## sessions"
          curl -sS -m 60 -H "$auth" "$api/sessions" > s.json
          jq -c '.[] | {id, featureId, state: .machine.state, reason: .machine.reason, lanes: [(.lanes // [])[] | {role, state: (.state // null)}], head, needs, overBudget, syncPending, updatedAt, items: [(.workItems // .plan.items // [])[]? | {id, kind, role, status}]}' s.json | cut -c1-3000
          echo "## events tail"
          curl -sS -m 60 -H "$auth" "$api/events?after=0" > e.json
          jq 'length' e.json
          jq -r '.[-150:][] | select(.event.type != "assistant.message_delta") | "\(.seq) \(.at // .event.at // "") \(.event.type) \(.event.sessionId // "") \(.event.role // "") \(.event.from // "")->\(.event.to // "") \(.event.reason // .event.message // .event.summary // .event.toolName // "" | tostring | .[0:300])"' e.json
          echo "## telemetry"
          now=$(date +%s000)
          from=$(date -d '2026-10-14T17:50:00Z' +%s000)
          to=$(date -d '2026-10-14T19:20:00Z' +%s000)
          body=$(jq -n --argjson from "$from" --argjson to "$to" '{queryId: "probe", timeframe: {from: $from, to: $to}, view: "events", limit: 2000, parameters: {filters: [{key: "$metadata.service", operation: "eq", type: "string", value: "chef-dev"}]}}')
          curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' -d "$body" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" > t.json
          jq -c '{success, errors, keys: (.result | keys? // null)}' t.json | cut -c1-2000
          jq -r '(.result.events.events // [])[] | [(.timestamp|tostring), (.["$metadata"].level // ""), (.["$metadata"].type // ""), ((.["$workers"].entrypoint // .["$workers"].scriptName // "")|tostring), ((.["$metadata"].message // .["$metadata"].error // "") | tostring | .[0:600])] | @tsv' t.json | sort | grep -v -i "^$" | tail -1500
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: "*.json"
