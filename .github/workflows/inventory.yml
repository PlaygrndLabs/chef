name: inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CHEF_PASSWORD: ${{ secrets.CHEF_PASSWORD }}
      CHEF_URL: https://chef-dev.playgrndlabs.workers.dev
    steps:
      - name: Probe notes2
        run: |
          set -uo pipefail
          auth="authorization: Bearer $CHEF_PASSWORD"
          api="$CHEF_URL/api/projects/notes2"
          echo "## sessions"
          curl -sS -m 60 -H "$auth" "$api/sessions" > s.json
          jq -c '.[] | {id, featureId, state: .machine.state, reason: .machine.reason, lanes: [(.lanes // [])[] | {role, state: (.state // null)}], head, needs, overBudget, syncPending, updatedAt, items: [(.workItems // .plan.items // [])[]? | {id, kind, role, status}]}' s.json | cut -c1-3000
          echo "## events"
          last=0; : > e.jsonl
          for i in $(seq 1 40); do
            page=$(curl -sS -m 60 -H "$auth" "$api/events?after=$last")
            n=$(echo "$page" | jq 'length'); [ "$n" = "0" ] && break
            echo "$page" | jq -c '.[]' >> e.jsonl
            last=$(echo "$page" | jq '.[-1].seq')
          done
          wc -l e.jsonl
          q() {
            body=$(jq -n --arg id "$1" --argjson filters "$2" --argjson from "$(date -d "$3" +%s000)" --argjson to "$(date -d "$4" +%s000)" '{queryId: $id, timeframe: {from: $from, to: $to}, view: "events", limit: 2000, parameters: {filterCombination: "and", filters: ([{key: "$metadata.service", operation: "eq", type: "string", value: "chef-dev"}] + $filters)}}')
            curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' -d "$body" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" > "t-$1.json"
            echo "## $1: $(jq -c '{success, errors, n: (.result.events.events // [] | length)}' "t-$1.json")"
          }
          q alarms '[{"key":"$workers.eventType","operation":"eq","type":"string","value":"alarm"}]' 2026-10-14T17:40:00Z 2026-10-14T19:30:00Z
          q problems '[{"key":"$metadata.level","operation":"neq","type":"string","value":"info"}]' 2026-10-14T17:40:00Z 2026-10-14T19:30:00Z
          q sessionagent '[{"key":"$workers.entrypoint","operation":"eq","type":"string","value":"SessionAgent"}]' 2026-10-14T17:40:00Z 2026-10-14T19:30:00Z
          q notok '[{"key":"$workers.outcome","operation":"neq","type":"string","value":"ok"}]' 2026-10-14T17:40:00Z 2026-10-14T19:30:00Z
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: |
            *.json
            *.jsonl
