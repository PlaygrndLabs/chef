name: inventory

on:
  workflow_dispatch:
    inputs:
      records:
        description: Project whose coder turn records to print from its transcript bucket; empty prints none
        required: false
        default: ""
      tail:
        description: Worker whose Durable Object alarms to watch for seven minutes; empty watches none
        required: false
        default: ""
      query:
        description: A GraphQL Analytics query to print, with $a account, $s since and $u until (dates, last two days); empty prints none
        required: false
        default: ""
      usage:
        description: Days of Durable Object and container usage to print per namespace, day and object; empty prints none
        required: false
        default: ""

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RECORDS: ${{ inputs.records }}
      USAGE_DAYS: ${{ inputs.usage }}
      TAIL: ${{ inputs.tail }}
      QUERY: ${{ inputs.query }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: List Cloudflare resources
        working-directory: workers
        run: |
          set -uo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          get() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$1"; }
          echo "## Workers"
          get "workers/workers?per_page=100" | jq -r '.result[]? | "\(.name)\ttags=\((.tags // []) | join(","))\tcreated=\(.created_on // "")"'
          echo "## Worker scripts"
          get "workers/scripts" | jq -r '.result[]? | "\(.id)\tmodified=\(.modified_on // "")"'
          echo "## Workflows"
          get "workflows?per_page=100" | jq -r '.result[]? | "\(.name)\tscript=\(.script_name)"'
          echo "## Durable Object namespaces"
          get "workers/durable_objects/namespaces?per_page=1000" | jq -r '.result[]? | "\(.id)\tscript=\(.script // "")\tclass=\(.class // "")"'
          echo "## Container applications"
          get "containers/applications" | jq -r '.result[]? | "\(.id)\t\(.name)\tnamespace=\(.durable_objects.namespace_id // "")"'
          echo "## Vectorize indexes"
          get "vectorize/v2/indexes" | jq -r '.result[]? | .name'
          echo "## KV namespaces"
          get "storage/kv/namespaces?per_page=100" | jq -r '.result[]? | "\(.id)\t\(.title)"'
          echo "## R2 buckets"
          get "r2/buckets" | jq -r '.result.buckets[]? | .name'
          for bucket in $(get "r2/buckets" | jq -r '.result.buckets[]? | .name | select(endswith("-transcripts"))'); do
            echo "### $bucket"
            objects=$(get "r2/buckets/$bucket/objects?per_page=1000")
            echo "$objects" | jq -r '.result[]? | "\(.key)\t\(.size)\t\(.last_modified // "")"'
            if [ -n "$RECORDS" ]; then
              for key in $(echo "$objects" | jq -r --arg p "$RECORDS/" '.result[]? | .key | select(startswith($p) and test("/turns/[^/]+\\.json$"))'); do
                echo "#### $key"
                get "r2/buckets/$bucket/objects/$(jq -rn --arg k "$key" '$k | @uri')" | jq -c .
              done
            fi
          done
          echo "## Pages projects"
          get "pages/projects" | jq -r '.result[]? | .name'
          echo "## Artifacts"
          for ns in $(npx wrangler artifacts namespaces list --json 2>/dev/null | jq -r '(if type == "array" then . else (.namespaces // .result // []) end)[] | .namespace // .name // empty'); do
            echo "namespace $ns: $(npx wrangler artifacts repos list --namespace "$ns" --json 2>/dev/null | jq -r '[(if type == "array" then . else (.repos // .result // []) end)[] | .name // empty] | join(" ")')"
          done
      - name: Durable Object and container usage
        if: inputs.usage != ''
        run: |
          set -uo pipefail
          since=$(date -u -d "-$USAGE_DAYS days" +%Y-%m-%d)
          until=$(date -u +%Y-%m-%d)
          gql() {
            jq -n --arg q "$1" --arg a "$CLOUDFLARE_ACCOUNT_ID" --arg s "$since" --arg u "$until" '{query: $q, variables: {a: $a, s: $s, u: $u}}' |
              curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data @- https://api.cloudflare.com/client/v4/graphql
          }
          echo "## Namespaces"
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/durable_objects/namespaces?per_page=1000" |
            jq -r '.result[]? | "\(.id)\t\(.script // "")\t\(.class // "")"' | tee namespaces.tsv
          echo "## Schema"
          for t in AccountDurableObjectsPeriodicGroupsDimensions AccountDurableObjectsPeriodicGroupsSum AccountDurableObjectsPeriodicGroupsMax AccountDurableObjectsInvocationsAdaptiveGroupsDimensions AccountDurableObjectsInvocationsAdaptiveGroupsSum; do
            gql "{ __type(name: \"$t\") { name fields { name } } }" | jq -c '.data.__type // .errors'
          done
          echo "## Duration by day and namespace (GB-s = activeTime s x 0.125)"
          gql 'query($a: string!, $s: Date!, $u: Date!) { viewer { accounts(filter: {accountTag: $a}) {
            durableObjectsPeriodicGroups(limit: 10000, filter: {date_geq: $s, date_leq: $u}, orderBy: [date_ASC]) {
              dimensions { date namespaceId } sum { activeTime cpuTime } max { activeWebsocketConnections } } } } }' |
            tee periodic.json | jq -r '.errors // empty, (.data.viewer.accounts[0].durableObjectsPeriodicGroups[]? | "\(.dimensions.date)\t\(.dimensions.namespaceId)\t\(.sum.activeTime / 8000000 | floor) GB-s\tcpu=\(.sum.cpuTime / 1000000 | floor)s\tws=\(.max.activeWebsocketConnections)")'
          echo "## Top objects by duration"
          gql 'query($a: string!, $s: Date!, $u: Date!) { viewer { accounts(filter: {accountTag: $a}) {
            durableObjectsPeriodicGroups(limit: 10000, filter: {date_geq: $s, date_leq: $u}) {
              dimensions { namespaceId objectId } sum { activeTime } } } } }' |
            jq -r '.errors // empty, ([.data.viewer.accounts[0].durableObjectsPeriodicGroups[]?] | group_by(.dimensions.namespaceId + .dimensions.objectId) | map({ns: .[0].dimensions.namespaceId, id: .[0].dimensions.objectId, gbs: (map(.sum.activeTime) | add / 8000000 | floor)}) | sort_by(-.gbs) | .[:40][] | "\(.gbs) GB-s\t\(.ns)\t\(.id)")'
          echo "## Requests by day and script"
          gql 'query($a: string!, $s: Date!, $u: Date!) { viewer { accounts(filter: {accountTag: $a}) {
            durableObjectsInvocationsAdaptiveGroups(limit: 10000, filter: {date_geq: $s, date_leq: $u}, orderBy: [date_ASC]) {
              dimensions { date scriptName namespaceId } sum { requests } } } } }' |
            jq -r '.errors // empty, (.data.viewer.accounts[0].durableObjectsInvocationsAdaptiveGroups[]? | "\(.dimensions.date)\t\(.dimensions.scriptName)\t\(.dimensions.namespaceId)\t\(.sum.requests)")'
          echo "## Hours of the top objects over the last two days"
          since=$(date -u -d "-1 days" +%Y-%m-%d)
          gql 'query($a: string!, $s: Date!, $u: Date!) { viewer { accounts(filter: {accountTag: $a}) {
            durableObjectsPeriodicGroups(limit: 10000, filter: {date_geq: $s, date_leq: $u}) {
              dimensions { namespaceId objectId } sum { activeTime } } } } }' > top.json
          for key in $(jq -r '[.data.viewer.accounts[0].durableObjectsPeriodicGroups[]?] | sort_by(-.sum.activeTime) | .[:4][] | .dimensions.objectId' top.json); do
            echo "### $key"
            jq -n --arg q 'query($a: string!, $s: Date!, $u: Date!, $o: string!) { viewer { accounts(filter: {accountTag: $a}) {
              periodic: durableObjectsPeriodicGroups(limit: 100, filter: {date_geq: $s, date_leq: $u, objectId: $o}, orderBy: [datetimeHour_ASC]) {
                dimensions { datetimeHour } sum { activeTime cpuTime duration subrequests } max { activeWebsocketConnections memoryUsageBytes } }
              calls: durableObjectsInvocationsAdaptiveGroups(limit: 1000, filter: {date_geq: $s, date_leq: $u, objectId: $o}, orderBy: [datetimeHour_ASC]) {
                dimensions { datetimeHour type } sum { requests wallTime } } } } }' --arg a "$CLOUDFLARE_ACCOUNT_ID" --arg s "$since" --arg u "$until" --arg o "$key" '{query: $q, variables: {a: $a, s: $s, u: $u, o: $o}}' |
              curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data @- https://api.cloudflare.com/client/v4/graphql |
              jq -c '.errors // empty, (.data.viewer.accounts[0].periodic[]?), (.data.viewer.accounts[0].calls[]?)'
          done
      - name: Watch Durable Object alarms
        if: inputs.tail != ''
        working-directory: workers
        run: |
          set -uo pipefail
          timeout 420 npx wrangler tail "$TAIL" --format json > tail.jsonl 2> tail.err || true
          echo "## Alarm and RPC events"
          jq -c 'select(.event.scheduledTime? != null or (.entrypoint // "") != "") | {at: (.eventTimestamp / 1000 | todate), entrypoint, outcome, wallTime, cpuTime, event: (.event | if . == null then null else (keys) end), logs: [.logs[]? | (.message | tostring)[0:300]], exceptions: [.exceptions[]? | .message]}' tail.jsonl | head -200
          echo "## Errors"
          tail -20 tail.err
      - name: GraphQL Analytics query
        if: inputs.query != ''
        run: |
          set -uo pipefail
          jq -n --arg q "$QUERY" --arg a "$CLOUDFLARE_ACCOUNT_ID" --arg s "$(date -u -d '-1 days' +%Y-%m-%d)" --arg u "$(date -u +%Y-%m-%d)" '{query: $q, variables: {a: $a, s: $s, u: $u}}' |
            curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data @- https://api.cloudflare.com/client/v4/graphql | jq -c '.errors // empty, (.data | to_entries[] | select(.key != "viewer")), (.data.viewer.accounts[0] // {} | to_entries[] | .key as $k | .value[]? | {($k): .})'
