name: signin-app

# Shows the Sign in with Cloudflare app and its domain verification without deploying the site.
on:
  workflow_dispatch:
    inputs:
      restart:
        description: Restart domain verification
        type: boolean
        default: false
      logs:
        description: Minutes of chef-site request logs to show (0 for none)
        type: number
        default: 0

permissions:
  contents: read

jobs:
  signin-app:
    if: github.repository == 'PlaygrndLabs/chef'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.SITE_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SITE_CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Show the sign-in app
        env:
          RESTART: ${{ inputs.restart }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/oauth_clients"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          site="https://chef.playgrndlabs.com"
          client=$(curl -sS -H "$auth" "$api?per_page=100" | jq -c --arg cb "$site/auth/callback" '[.result[]? | select((.redirect_uris // []) | index($cb))][0] // empty')
          if [ -z "$client" ]; then
            echo "::error::Cloudflare did not list the sign-in app for this token."
            exit 1
          fi
          if [ "$RESTART" = "true" ]; then
            id=$(echo "$client" | jq -r '.client_id // .id')
            body=$(echo "$client" | jq -c '{client_uri}')
            client=$(curl -sS -X PATCH -H "$auth" -H "content-type: application/json" "$api/$id" -d "$body" | jq -c '.result // .')
            echo "restarted domain verification"
          fi
          echo "$client" | jq 'with_entries(select(.key | test("secret") | not))'
          echo "::notice::Domain verification: $(echo "$client" | jq -c '.client_uri_verification // "none"')"
          echo "TXT records Cloudflare's resolver sees now:"
          for name in playgrndlabs.com chef.playgrndlabs.com; do
            echo "$name: $(curl -sS -H 'accept: application/dns-json' "https://cloudflare-dns.com/dns-query?name=$name&type=TXT" | jq -c '[.Answer[]?.data]')"
          done
      - name: Show recent site requests
        if: inputs.logs > 0
        env:
          MINUTES: ${{ inputs.logs }}
        run: |
          set -euo pipefail
          now=$(($(date +%s) * 1000))
          from=$((now - MINUTES * 60000))
          body=$(jq -nc --argjson from "$from" --argjson to "$now" '{queryId: "site-logs", timeframe: {from: $from, to: $to}, view: "events", limit: 200, parameters: {filters: [{key: "$metadata.service", operation: "eq", type: "string", value: "chef-site"}]}}')
          out=$(curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/json" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" -d "$body")
          if [ "$(echo "$out" | jq -r '.success')" != "true" ]; then
            echo "::warning::Cloudflare did not return logs: $(echo "$out" | jq -c '.errors')"
            exit 0
          fi
          echo "$out" | jq -r '.result.events.events[0] // {} | [paths(scalars) | map(tostring) | join(".")] | join(" ")'
          echo "$out" | jq -r '.result.events.events[]? | [((.timestamp // 0) / 1000 | floor | todate), (.["$workers"].event.request.method // ""), ((.["$workers"].event.request.url // "") | sub("\\?.*"; "")), (.["$workers"].event.response.status // "" | tostring), (.["$workers"].outcome // ""), ((.["$metadata"].message // "") | tostring | gsub("\\?[^ ]*"; "") | gsub("[^ @]+@[^ ]+"; "<email>") | .[0:200])] | join(" ")'
