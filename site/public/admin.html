<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chef admin</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="/" aria-label="chef home"><img class="light" src="/chef-logo.svg" alt="chef" width="105" height="30"><img class="dark" src="/chef-logo-dark.svg" alt="" width="105" height="30"></a>
    <nav class="links"><a href="/">Back to chef</a></nav>
  </div>
</header>

<main class="wrap admin">
  <h1>Members</h1>
  <p class="sub muted">Every organization on chef, where its chef runs and how its setup went, and everyone who signed in with Cloudflare.</p>
  <div class="stats" id="stats"></div>
  <p class="error" id="error" role="alert"></p>
  <h2>Organizations</h2>
  <div class="table">
    <table>
      <thead><tr><th>Organization</th><th>chef</th><th>Setup</th><th>Created</th></tr></thead>
      <tbody id="orgs"><tr><td colspan="4" class="muted">Loading…</td></tr></tbody>
    </table>
  </div>
  <h2>People</h2>
  <div class="table">
    <table>
      <thead><tr><th>Person</th><th>Organizations</th><th>Joined</th><th>Last sign-in</th></tr></thead>
      <tbody id="users"><tr><td colspan="4" class="muted">Loading…</td></tr></tbody>
    </table>
  </div>
</main>
<script src="/admin.js" defer></script>
</body>
</html>
